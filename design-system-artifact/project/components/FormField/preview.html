<!doctype html>
<html><head><meta charset="utf-8"><style>
body { margin: 0; background: var(--background); }
</style></head>
<body><div class="pg-root" style="padding: 16px">
<div class="pg-stack" style="max-width: 420px; gap: 20px">
  <div class="pg-field">
    <span class="pg-field-label">Email</span>
    <label class="pg-input"><input placeholder="you@university.edu"></label>
    <span class="pg-field-note">Use the address you study with.</span>
  </div>
  <div class="pg-field">
    <span class="pg-field-label">Password</span>
    <label class="pg-input is-invalid"><input type="password" value="penguin"><span aria-label="Show password"><svg class="pg-icon " viewBox="0 0 24 24" aria-hidden="true"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/><circle cx="12" cy="12" r="3"/></svg></span></label>
    <span class="pg-field-note error"><svg class="pg-icon sm" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/></svg>Use at least 8 characters.</span>
  </div>
</div>
</div></body></html>
