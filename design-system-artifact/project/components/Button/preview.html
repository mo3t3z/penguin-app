<!doctype html>
<html><head><meta charset="utf-8"><style>
body { margin: 0; background: var(--background); }
</style></head>
<body><div class="pg-root" style="padding: 16px">
<div class="pg-stack">
  <div class="pg-row">
    <button class="pg-button primary">Create a post</button>
    <button class="pg-button outline">Try again</button>
    <button class="pg-button ghost">Retry</button>
    <button class="pg-button link">Show more</button>
    <button class="pg-button destructive">Delete post</button>
  </div>
  <div class="pg-row">
    <button class="pg-button primary sm">Save</button>
    <button class="pg-button outline sm"><svg class="pg-icon sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.375 2.625a1 1 0 0 1 3 3l-9.013 9.014a2 2 0 0 1-.853.505l-2.873.84a.5.5 0 0 1-.62-.62l.84-2.873a2 2 0 0 1 .506-.852z"/></svg>Edit profile</button>
    <button class="pg-button primary is-disabled" disabled>Publish</button>
    <button class="pg-button outline is-disabled" disabled>Next</button>
    <button class="pg-button primary" aria-busy="true"><span class="pg-spinner"></span>Publishing</button>
  </div>
</div>
</div></body></html>
