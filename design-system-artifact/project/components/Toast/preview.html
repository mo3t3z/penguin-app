<!-- @dsCard group="Feedback" height=220 -->
<!doctype html>
<html><head><meta charset="utf-8"><style>
body { margin: 0; background: var(--background); }
</style></head>
<body><div class="pg-root" style="padding: 16px">
<div class="pg-stack" style="max-width: 420px">
  <div class="pg-toast" role="status"><svg class="pg-icon " viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="m16 9-5.5 5.5L8 12"/></svg><span class="pg-toast-message">Post published</span><span class="pg-toast-action">View</span></div>
  <div class="pg-toast success" role="status"><svg class="pg-icon " viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="m16 9-5.5 5.5L8 12"/></svg><span class="pg-toast-message">Profile saved</span></div>
  <div class="pg-toast error" role="status"><svg class="pg-icon " viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/></svg><span class="pg-toast-message">Couldn’t send. Check your connection.</span><span class="pg-toast-action">Retry</span></div>
</div>
</div></body></html>
